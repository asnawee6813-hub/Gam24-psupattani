<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>เกม 24 – เลือกสมการ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #07070d;
            --card2: #15151f;
            --ink: #f3f4fb;
            --mut: #8a8ca3;
            --acc: #5b8cff;
            --accbg: rgba(91, 140, 255, .14);
            --line: rgba(255, 255, 255, .08);
            --ok: #34d399;
            --bad: #fb7185;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: 'Noto Sans Thai', 'Outfit', system-ui, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(70% 50% at 15% 0, rgba(98, 84, 255, .45), transparent 60%), radial-gradient(60% 50% at 95% 100%, rgba(37, 99, 235, .4), transparent 60%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased
        }

        .wrap {
            max-width: 430px;
            margin: 0 auto;
            padding: 22px 14px 40px
        }

        .hidden {
            display: none !important
        }

        .scr {
            position: relative;
            border-radius: 34px;
            padding: 26px 20px 22px;
            background: linear-gradient(180deg, #14172e 0, #0c0c15 240px, #0b0b12);
            border: 1px solid rgba(255, 255, 255, .07);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 6px rgba(255, 255, 255, .02);
            overflow: hidden
        }

        .scr::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 260px;
            background: radial-gradient(70% 100% at 80% 0, rgba(91, 140, 255, .28), transparent 70%);
            pointer-events: none
        }

        .scr>* {
            position: relative
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font: 600 20px 'Outfit', sans-serif
        }

        .hero {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 22px 0 14px
        }

        .hero i,
        .num {
            font: 700 30px 'Outfit', sans-serif;
            font-style: normal;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(150deg, rgba(124, 160, 255, .55), rgba(60, 70, 190, .35));
            border: 1px solid rgba(255, 255, 255, .18);
            box-shadow: 0 12px 28px rgba(60, 80, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .3)
        }

        .hero i {
            width: 62px;
            height: 76px;
            transform: rotate(var(--r));
            animation: fl 4s ease-in-out infinite var(--d)
        }

        h1 {
            font: italic 700 34px/1.15 'Outfit', 'Noto Sans Thai', sans-serif;
            text-align: center;
            margin: 6px 0
        }

        h1 em {
            font-style: italic;
            background: linear-gradient(90deg, #7cb0ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sub {
            text-align: center;
            color: var(--mut);
            font-size: 14px;
            margin: 0 0 18px;
            font-weight: 300
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .04);
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: .15s
        }

        input:focus {
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--accbg)
        }

        .sh {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 24px 0 10px;
            font-size: 17px;
            font-weight: 600
        }

        .tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .tile {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            text-align: left;
            padding: 16px;
            min-height: 120px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: linear-gradient(150deg, #262a3d, #15161f);
            color: var(--ink);
            font: inherit;
            cursor: pointer;
            transition: .2s
        }

        .tile svg {
            width: 30px;
            height: 30px;
            stroke: #9ec1ff;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: auto;
            filter: drop-shadow(0 4px 10px rgba(91, 140, 255, .7))
        }

        .tile b {
            font-size: 15px;
            font-weight: 600
        }

        .tile small {
            font-size: 11px;
            color: #aab6d8;
            font-weight: 300
        }

        .tile.on {
            background: linear-gradient(150deg, #2f6bff, #1a2a86);
            border-color: rgba(158, 193, 255, .6);
            box-shadow: 0 10px 30px rgba(47, 107, 255, .35)
        }

        .difs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px
        }

        .dif {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: 0;
            color: var(--mut);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            padding: 4px
        }

        .dif span {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--card2);
            border: 1px solid var(--line);
            transition: .2s
        }

        .dif.on {
            color: var(--ink)
        }

        .dif.on span {
            background: linear-gradient(150deg, #2f6bff, #6d4cff);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 8px 22px rgba(79, 92, 255, .5)
        }

        .rv {
            animation: up .4s ease
        }

        .dif em {
            font-style: normal
        }

        .dif small {
            margin-top: -6px;
            font-size: 11px;
            color: var(--mut);
            font-weight: 300
        }

        .info {
            text-align: center;
            color: var(--mut);
            font-size: 12px;
            line-height: 1.7;
            margin: 14px 8px 0;
            font-weight: 300
        }

        .btn {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid rgba(124, 160, 255, .55);
            background: linear-gradient(180deg, rgba(91, 140, 255, .2), rgba(91, 140, 255, .05));
            color: #fff;
            font: inherit;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(91, 140, 255, .18);
            transition: .2s
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(180deg, rgba(91, 140, 255, .38), rgba(91, 140, 255, .12));
            transform: translateY(-1px)
        }

        .btn:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .btn.alt {
            border-color: var(--line);
            background: rgba(255, 255, 255, .03);
            box-shadow: none
        }

        .row {
            display: flex;
            gap: 10px
        }

        .row .btn {
            margin-top: 10px
        }

        .li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 16px;
            background: var(--card2);
            border: 1px solid var(--line)
        }

        .li.me {
            border-color: rgba(124, 160, 255, .7);
            background: rgba(91, 140, 255, .12)
        }

        .av {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font: 600 15px 'Outfit', sans-serif;
            background: #22232f;
            color: var(--mut);
            flex: none
        }

        .av.r1 {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #3b2a00
        }

        .av.r2 {
            background: linear-gradient(135deg, #e5e7eb, #9ca3af);
            color: #1f2937
        }

        .av.r3 {
            background: linear-gradient(135deg, #fdba74, #c2410c);
            color: #2b1200
        }

        .nm {
            flex: 1;
            min-width: 0
        }

        .nm b {
            display: block;
            font-weight: 500;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .nm small {
            color: var(--mut);
            font-size: 12px
        }

        .pt {
            font: 600 22px 'Outfit', sans-serif
        }

        .empty {
            color: var(--mut);
            font-size: 13px;
            text-align: center;
            padding: 16px;
            font-weight: 300;
            border: 1px dashed var(--line);
            border-radius: 16px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .who {
            font-size: 13px;
            color: var(--mut);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .cap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, .07);
            border-radius: 999px;
            padding: 3px;
            flex: none
        }

        .ib {
            width: 38px;
            height: 34px;
            border: 0;
            background: none;
            color: var(--ink);
            display: grid;
            place-items: center;
            cursor: pointer;
            border-radius: 999px;
            transition: .15s
        }

        .ib:hover {
            background: rgba(255, 255, 255, .1)
        }

        .ib svg {
            display: block
        }

        .sep {
            width: 1px;
            height: 16px;
            background: var(--line)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0 12px;
            text-align: center
        }

        .stats>div {
            padding: 12px 4px;
            border-radius: 16px;
            background: var(--card2);
            border: 1px solid var(--line)
        }

        .stats small {
            display: block;
            font-size: 11px;
            color: var(--mut)
        }

        .stats b {
            display: inline-block;
            font: 600 28px/1.2 'Outfit', sans-serif
        }

        .bar {
            height: 4px;
            background: var(--line);
            border-radius: 4px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #5b8cff, #7c5cff)
        }

        .bar.low i {
            background: var(--bad)
        }

        .nums {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 22px 0 14px
        }

        .num {
            flex: 1;
            max-width: 84px;
            aspect-ratio: 1/1.1;
            font-size: 42px
        }

        .opt {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            margin-top: 9px;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--card2);
            color: var(--ink);
            font: 500 19px 'Outfit', 'Noto Sans Thai', sans-serif;
            cursor: pointer;
            text-align: left;
            transition: .15s
        }

        .opt b {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .07);
            color: var(--mut);
            display: grid;
            place-items: center;
            font: 600 14px 'Outfit', sans-serif;
            flex: none
        }

        .opt:hover:not(:disabled) {
            border-color: rgba(124, 160, 255, .7);
            background: var(--accbg);
            transform: translateX(4px)
        }

        .opt.ok {
            border-color: var(--ok);
            background: color-mix(in srgb, var(--ok) 16%, transparent)
        }

        .opt.bad {
            border-color: var(--bad);
            background: color-mix(in srgb, var(--bad) 16%, transparent)
        }

        .opt:disabled {
            cursor: default
        }

        .eyebrow {
            text-align: center;
            font-size: 12px;
            color: var(--acc);
            letter-spacing: .14em
        }

        .big {
            text-align: center;
            font: 700 96px/1 'Outfit', sans-serif;
            margin: 10px 0 0;
            background: linear-gradient(180deg, #fff, #7cb0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .bsub {
            text-align: center;
            color: var(--mut);
            font-size: 13px
        }

        .msg {
            text-align: center;
            color: var(--mut);
            margin: 8px 0 0;
            font-size: 14px
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 10, .65);
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            padding: 20px;
            z-index: 9
        }

        .box {
            background: #12121c;
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 26px 22px;
            max-width: 340px;
            width: 100%;
            text-align: center
        }

        .box p {
            margin: 0 0 4px;
            font-size: 16px
        }

        .box small {
            color: var(--mut);
            font-weight: 300
        }

        .rip {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: .25;
            transform: scale(0);
            animation: rp .6s ease-out forwards;
            pointer-events: none
        }

        @keyframes rp {
            to {
                transform: scale(1);
                opacity: 0
            }
        }

        @keyframes fl {
            50% {
                transform: translateY(-8px) rotate(var(--r))
            }
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.6) rotate(-6deg)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes slide {
            from {
                opacity: 0;
                transform: translateX(-14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-7px)
            }

            40%,
            80% {
                transform: translateX(7px)
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.14)
            }
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent)
            }

            to {
                box-shadow: 0 0 0 16px transparent
            }
        }

        .scr.in {
            animation: up .45s cubic-bezier(.2, .7, .2, 1)
        }

        .scr.shake {
            animation: shake .4s
        }

        .num {
            animation: pop .45s cubic-bezier(.3, 1.4, .5, 1) backwards
        }

        .num:nth-child(2) {
            animation-delay: .06s
        }

        .num:nth-child(3) {
            animation-delay: .12s
        }

        .num:nth-child(4) {
            animation-delay: .18s
        }

        .opt {
            animation: slide .35s ease backwards
        }

        .opt:nth-child(1) {
            animation-delay: .12s
        }

        .opt:nth-child(2) {
            animation-delay: .18s
        }

        .opt:nth-child(3) {
            animation-delay: .24s
        }

        .opt:nth-child(4) {
            animation-delay: .3s
        }

        .opt.ok {
            animation: glow .6s ease-out
        }

        #tl.low {
            color: var(--bad);
            animation: pulse 1s infinite
        }

        #cdn {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 50%, rgba(60, 70, 190, .4), rgba(5, 5, 12, .93) 70%);
            backdrop-filter: blur(8px)
        }

        #cdn>* {
            grid-area: 1/1
        }

        .rg {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 2px solid rgba(124, 160, 255, .7);
            box-shadow: 0 0 60px rgba(91, 140, 255, .5), inset 0 0 60px rgba(91, 140, 255, .25);
            animation: rg .9s ease-out
        }

        .cn {
            font: italic 700 150px/1 'Outfit', sans-serif;
            padding: 0 .1em;
            background: linear-gradient(180deg, #fff, #7cb0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: cnp .9s cubic-bezier(.2, .8, .2, 1);
            filter: drop-shadow(0 0 30px rgba(91, 140, 255, .7))
        }

        .cn.go {
            font-size: 104px;
            background: linear-gradient(90deg, #34d399, #5b8cff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text
        }

        .cl {
            transform: translateY(130px);
            font-size: 13px;
            letter-spacing: .3em;
            color: var(--mut)
        }

        @keyframes cnp {
            0% {
                transform: scale(.3);
                opacity: 0
            }

            30% {
                transform: scale(1.08);
                opacity: 1
            }

            70% {
                transform: scale(1);
                opacity: 1
            }

            100% {
                transform: scale(1.5);
                opacity: 0
            }
        }

        @keyframes rg {
            0% {
                transform: scale(.4);
                opacity: 1
            }

            100% {
                transform: scale(2.2);
                opacity: 0
            }
        }

        #cd,
        #cr {
            position: fixed;
            left: 0;
            top: 0;
            pointer-events: none;
            z-index: 99;
            border-radius: 50%;
            opacity: 0
        }

        #cd {
            width: 7px;
            height: 7px;
            margin: -3.5px 0 0 -3.5px;
            background: #9ec1ff;
            transition: opacity .2s
        }

        #cr {
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            border: 1px solid #7cb0ff;
            transition: width .2s, height .2s, margin .2s, background .2s, opacity .2s
        }

        #cr.hov {
            width: 56px;
            height: 56px;
            margin: -28px 0 0 -28px;
            background: var(--accbg)
        }

        #cr.down {
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px
        }

        html.cx,
        html.cx * {
            cursor: none !important
        }

        html.cx input {
            cursor: text !important
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        /* ===== ธีมโปสเตอร์ย้อนยุค: ครีม ชมพู น้ำเงิน เหลือง ===== */
        :root {
            --cream: #f4ead2;
            --paper: #fffaf0;
            --ink: #1d1f4d;
            --blue: #4650c8;
            --pink: #eb9bd0;
            --yellow: #f8de4a;
            --red: #e2553c;
            --bg: #eb9bd0;
            --card2: #fffaf0;
            --mut: #5d5f8f;
            --acc: #4650c8;
            --accbg: rgba(70, 80, 200, .14);
            --line: rgba(29, 31, 77, .28);
            --ok: #1f9d63;
            --bad: #e2553c;
            color-scheme: light
        }

        body {
            background-color: var(--pink);
            background-image: repeating-linear-gradient(90deg, transparent 0 70px, rgba(255, 255, 255, .16) 70px 74px);
            color: var(--ink)
        }

        .scr {
            background-color: var(--cream);
            background-image: radial-gradient(rgba(29, 31, 77, .09) 1.2px, transparent 1.5px);
            background-size: 14px 14px;
            border: 3px solid var(--ink);
            border-radius: 24px;
            box-shadow: 8px 8px 0 var(--ink);
            padding-bottom: 34px
        }

        .scr::before {
            height: 200px;
            background: radial-gradient(circle at 90% 12%, var(--yellow) 0 34px, transparent 35px), radial-gradient(circle at 8% 7%, var(--pink) 0 20px, transparent 21px)
        }

        .scr::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 14px;
            border-top: 3px solid var(--ink);
            background: repeating-linear-gradient(90deg, var(--blue) 0 24px, var(--pink) 24px 48px, var(--yellow) 48px 72px, var(--red) 72px 96px);
            pointer-events: none
        }

        .brand {
            color: var(--ink);
            font-family: 'Anton', 'Outfit', sans-serif;
            font-weight: 400;
            letter-spacing: .04em
        }

        .hero i,
        .num {
            font-family: 'Anton', 'Outfit', sans-serif;
            font-weight: 400;
            background: var(--blue);
            color: var(--yellow);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: 4px 4px 0 var(--ink)
        }

        .hero i {
            width: 62px;
            height: 80px;
            font-size: 44px
        }

        .hero i:nth-child(2) {
            background: var(--pink);
            color: var(--ink)
        }

        .hero i:nth-child(3) {
            background: var(--yellow);
            color: var(--ink)
        }

        .hero i:nth-child(4) {
            background: var(--red);
            color: var(--cream)
        }

        h1 {
            font: 400 40px/1.15 'Anton', 'Noto Sans Thai', sans-serif;
            color: var(--ink);
            letter-spacing: .02em
        }

        h1 em {
            font-style: normal;
            background: var(--blue);

        /* ===== หน้าโหลด 1-100 และมิติของหน้าเกม ===== */

        }

        #ldt {
            margin: 16px 0 0;
            font-weight: 700;
            color: var(--ink)
        }

        @keyframes stripe {
            to {
                background-position: 28px 0
            }
        }

        #cd,
        #cr {
            z-index: 500
        }

        .hero i,
        .num {
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 0 var(--ink), 0 2px 0 var(--ink), 0 3px 0 var(--ink), 0 4px 0 var(--ink), 0 5px 0 var(--ink), 0 6px 0 var(--ink), 0 7px 0 var(--ink), 0 18px 20px -6px rgba(29, 31, 77, .5)
        }

        .hero i::after,
        .num::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, .42) 0 24%, transparent 25% 100%);
            pointer-events: none
        }

        .wrap {
            position: relative;
            z-index: 1;
            perspective: 1100px
        }

        .scr {
            transform: rotateY(calc(var(--mx) * 5deg)) rotateX(calc(var(--my) * -4deg));
            box-shadow: 8px 8px 0 var(--ink), 15px 15px 0 rgba(29, 31, 77, .22), 0 44px 50px -20px rgba(29, 31, 77, .55)
        }

        .nums {
            perspective: 700px;
            transform: translate(calc(var(--mx) * 7px), calc(var(--my) * 5px))
        }

        .stats {
            transform: translate(calc(var(--mx) * 3px), calc(var(--my) * 2px))
        }

        #opts {
            perspective: 800px;
            transform: translate(calc(var(--mx) * -3px), calc(var(--my) * -2px))
        }

        .num {
            transform-origin: 50% 0;
            animation: flipIn .75s cubic-bezier(.2, 1.3, .4, 1) backwards, bob 3.4s ease-in-out 1s infinite
        }

        .num:nth-child(1) {
            animation-delay: 0s, 1s
        }

        .num:nth-child(2) {
            animation-delay: .09s, 1.4s
        }

        .num:nth-child(3) {
            animation-delay: .18s, 1.8s
        }

        .num:nth-child(4) {
            animation-delay: .27s, 2.2s
        }

        .opt {
            transform-origin: 50% 0;
            animation: optIn .55s cubic-bezier(.2, .9, .3, 1.15) backwards
        }

        .opt.ok {
            animation: glow .6s ease-out
        }

        #nums.cheer .num {
            animation: cheer .65s cubic-bezier(.3, 1.6, .5, 1) both
        }

        #nums.cheer .num:nth-child(2) {
            animation-delay: .07s
        }

        #nums.cheer .num:nth-child(3) {
            animation-delay: .14s
        }

        #nums.cheer .num:nth-child(4) {
            animation-delay: .21s
        }

        #nums.sad .num {
            animation: sad .6s ease-in-out both
        }

        @keyframes flipIn {
            from {
                opacity: 0;
                transform: rotateX(-95deg) translateY(-30px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes bob {
            50% {
                transform: translateY(-5px)
            }
        }

        @keyframes optIn {
            from {
                opacity: 0;
                transform: rotateX(-55deg) translateY(26px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes cheer {
            40% {
                transform: translateY(-24px) rotate(-6deg) scale(1.1)
            }

            100% {
                transform: none
            }
        }

        @keyframes sad {
            35% {
                transform: translateY(8px) rotate(4deg) scale(.96)
            }

            100% {
                transform: none
            }
        }

        #bgfx {

    <script>
        const TOTAL = 5, ATTACK = 60000, KEY = 'game24_lb_v5';

        const MATHDESC = { easy: 'ตัวเลข 1–6 · รวมเลขทีละคู่ให้เหลือ 24', medium: 'ตัวเลข 1–9 · รวมเลขทีละคู่ให้เหลือ 24', expert: 'ตัวเลข 1–9 · มี ² ³ √ เพิ่มให้ · รวมเลขทีละคู่ให้เหลือ 24' };
        const DIFFS = {

            medium: { label: 'ปานกลาง', max: 9, t: 20000, desc: 'ตัวเลข 1–9 · ตัวเลือกให้ค่าใกล้เคียง 24' },
            expert: { label: 'ยาก', max: 9, t: 20000, desc: 'ตัวเลข 1–9 · มียกกำลัง (² ³) และรากที่สอง (√) · ตัวเลือกใกล้ 24 มาก' }
        };
        const $ = id => document.getElementById(id);
        const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, COL = ['#4650c8', '#eb9bd0', '#f8de4a', '#e2553c', '#1f7a52'];
        function burst(x, y, n = 24) {
            if (RM) return; for (let i = 0; i < n; i++) {
                const p = document.createElement('i'), z = 4 + rnd(6);
                p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:${z}px;height:${z * (rnd(2) ? 1 : 2.2)}px;background:${COL[rnd(COL.length)]};border-radius:${rnd(2) ? '50%' : '1px'};pointer-events:none;z-index:450`;
                document.body.appendChild(p); const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 130;
                p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) rotate(${rnd(720) - 360}deg)`, opacity: 0 }], { duration: 700 + rnd(500), easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => p.remove()
            }
        }
        function floatText(x, y, t) {

            document.body.appendChild(e); e.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-56px)', opacity: 0 }], { duration: 850, easing: 'ease-out' }).onfinish = () => e.remove()
        }
        function shake() { const c = $('s-game'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake') }
        function bump() { if (!RM) $('sc').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.5)', color: '#e2553c' }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' }) }
        function countUp(el, to) { if (RM || !to) { el.textContent = to; return } const t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f) })(t0) }
        let snd = true, AC = null; try { snd = localStorage.getItem('game24_snd') !== '0' } catch (e) { }
        function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)() } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); return AC }
        function beep(f, d, v, type) {
            if (!snd) return; const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;

        function tick(low) { low ? (beep(1560, .07, .16), setTimeout(() => beep(1560, .07, .12), 110)) : beep(880, .045, .07) }
        const ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
        function updSnd() { $('snd').innerHTML = ICON + '<path d="M4 9v6h4l5 4V5L8 9H4z"/>' + (snd ? '<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>'; $('snd').title = snd ? 'ปิดเสียง' : 'เปิดเสียง' }
        const sel = { mode: null, style: null, diff: null };
        let G = null, raf = 0, lastId = null;
        const rnd = n => Math.floor(Math.random() * n);
        const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const catName = (m, st, d) => MODES[m].label + ' · ' + STYLES[st].label + ' · ' + DIFFS[d].label;

        /* ---------- อันดับ ---------- */
        function loadLB() { try { return JSON.parse(localStorage.getItem(KEY)) || [] } catch (e) { return [] } }
        function saveLB(a) { try { localStorage.setItem(KEY, JSON.stringify(a)) } catch (e) { } }
        const cmp = (a, b) => b.score - a.score || (a.mode !== 'attack' ? a.time - b.time : a.tried - b.tried);
        /* ชื่อซ้ำในหมวดเดียวกัน (โหมด + รูปแบบ + ระดับ) เก็บเฉพาะสถิติที่ดีที่สุด */
        const catKey = x => [x.mode, x.style, x.diff, String(x.name).trim().toLowerCase()].join('|');
        function dedupe(all) {
            const best = new Map();
            for (const x of all) { const k = catKey(x), o = best.get(k); if (!o || cmp(x, o) < 0) best.set(k, x) }
            return all.filter(x => best.get(catKey(x)) === x);
        }
        function renderLB(el, tEl, m, st, d) {
            tEl.textContent = 'อันดับสูงสุด — ' + catName(m, st, d);
            const lb = dedupe(loadLB()).filter(x => x.mode === m && x.style === st && x.diff === d).sort(cmp).slice(0, 10);
            if (!lb.length) { el.innerHTML = '<div class="empty">ยังไม่มีสถิติในหมวดนี้</div>'; return }
            el.innerHTML = lb.map((x, i) => `<div class="li ${x.id === lastId ? 'me' : ''}"><span class="av r${i < 3 ? i + 1 : 0}">${i + 1}</span><div class="nm"><b>${esc(x.name)}</b><small>${m !== 'attack' ? x.time.toFixed(1) + ' วินาที' : x.tried + ' ข้อที่เล่น'}</small></div><span class="pt">${x.score}</span></div>`).join('');
        }

        /* ---------- ตัวสร้างโจทย์ ---------- */
        const OPS = ['+', '−', '×', '÷'];
        function perms(a) { if (a.length < 2) return [a]; const r = []; a.forEach((x, i) => perms(a.filter((_, j) => j !== i)).forEach(p => r.push([x, ...p]))); return r }
        function X(o, L, R) {
            if (!L || !R) return null;
            if (o === '÷' && R.v === 0) return null;
            const p = (o === '+' || o === '−') ? 1 : 2;
            const v = o === '+' ? L.v + R.v : o === '−' ? L.v - R.v : o === '×' ? L.v * R.v : L.v / R.v;
            const ls = L.p < p ? `(${L.s})` : L.s;
            const rs = (R.p < p || (R.p === p && (o === '−' || o === '÷'))) ? `(${R.s})` : R.s;
            return { v, s: `${ls} ${o} ${rs}`, p };
        }
        function allExprs(n) {
            const out = [], seen = new Set();
            for (const q of perms(n)) {
                const [A, B, C, D] = q.map(x => ({ v: x, s: String(x), p: 3 }));
                for (const o1 of OPS) for (const o2 of OPS) for (const o3 of OPS) {
                    const P = [X(o3, X(o2, X(o1, A, B), C), D), X(o3, X(o1, A, X(o2, B, C)), D), X(o1, A, X(o3, X(o2, B, C), D)), X(o1, A, X(o2, B, X(o3, C, D))), X(o2, X(o1, A, B), X(o3, C, D))];
                    for (const e of P) { if (e && isFinite(e.v) && !seen.has(e.s)) { seen.add(e.s); out.push(e) } }
                }
            }
            return out;
        }
        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]] } return a }
        function modN(n, k) {
            if (!n || !k || Math.abs(n.v) < 2) return n;
            const b = n.p < 5 ? `(${n.s})` : n.s; let v, t;
            if (k === 1) { v = n.v * n.v; t = b + '²' }
            else if (k === 2) { v = n.v * n.v * n.v; t = b + '³' }
            else { if (n.v < 0) return n; const r = Math.sqrt(n.v); if (Math.abs(r - Math.round(r)) > 1e-9) return n; v = Math.round(r); t = '√' + b }
            if (!isFinite(v) || Math.abs(v) > 1500) return n;
            return { v, s: t, p: 5 };
        }
        function rndExpr(n) {
            const R = a => a[rnd(a.length)], K = () => { const q = Math.random(); return q < .62 ? 0 : q < .8 ? 1 : q < .88 ? 2 : 3 };
            const [A, B, C, D] = n.map(x => modN({ v: x, s: String(x), p: 5 }, K()));
            const o = () => R(OPS), m = x => modN(x, Math.random() < .3 ? (K() || 1) : 0);
            switch (rnd(5)) {
                case 0: return X(o(), m(X(o(), m(X(o(), A, B)), C)), D);
                case 1: return X(o(), m(X(o(), A, m(X(o(), B, C)))), D);
                case 2: return X(o(), A, m(X(o(), m(X(o(), B, C)), D)));
                case 3: return X(o(), A, m(X(o(), B, m(X(o(), C, D)))));
                default: return X(o(), m(X(o(), A, B)), m(X(o(), C, D)));
            }
        }
        function makeExpert() {
            for (; ;) {
                const n = Array.from({ length: 4 }, () => 1 + rnd(9)), good = [], bad = [], seen = new Set();
                for (let t = 0; t < 8000; t++) {
                    const e = rndExpr(shuffle(n.slice()));
                    if (!e || !isFinite(e.v) || !/[²³√]/.test(e.s) || seen.has(e.s)) continue; seen.add(e.s);
                    const k = Math.abs(e.v - 24);
                    if (k < 1e-6) good.push(e); else if (k <= 10) bad.push(e);
                }
                if (!good.length || bad.length < 3) continue;
                const right = good[rnd(good.length)], picks = [], vals = new Set();
                for (const b of shuffle(bad)) { const k = Math.round(b.v * 100); if (vals.has(k)) continue; vals.add(k); picks.push(b); if (picks.length === 3) break }
                if (picks.length < 3) continue;
                return { n: shuffle(n.slice()), opts: shuffle([{ s: right.s, ok: true }, ...picks.map(p => ({ s: p.s, ok: false }))]) };
            }
        }
        function makeQ(d) {
            if (d === 'expert') return makeExpert();
            const c = DIFFS[d];
            for (; ;) {
                const n = Array.from({ length: 4 }, () => 1 + rnd(c.max)), ex = allExprs(n);
                let good = ex.filter(e => Math.abs(e.v - 24) < 1e-6);
                if (!good.length) continue;
                if (d === 'easy') { const a = good.filter(e => !/[÷−]/.test(e.s)), b = good.filter(e => !e.s.includes('÷')); good = a.length ? a : b.length ? b : good }
                if (d === 'hard') { const a = good.filter(e => e.s.includes('÷')); if (a.length) good = a }
                let bad = ex.filter(e => Math.abs(e.v - 24) > 1e-6 && Math.abs(e.v) < 150);
                if (d !== 'hard') bad = bad.filter(e => Math.abs(e.v - Math.round(e.v)) < 1e-6);
                if (d === 'easy') bad = bad.filter(e => { const k = Math.abs(e.v - 24); return k >= 5 && k <= 30 });
                else { bad.sort((x, y) => Math.abs(x.v - 24) - Math.abs(y.v - 24)); bad = bad.slice(0, d === 'hard' ? 20 : 60) }
                const right = good[rnd(good.length)], picks = [], vals = new Set();
                for (const b of shuffle(bad.slice())) { const k = Math.round(b.v * 1000); if (vals.has(k)) continue; vals.add(k); picks.push(b); if (picks.length === 3) break }
                if (picks.length < 3) continue;
                return { n: shuffle(n.slice()), opts: shuffle([{ s: right.s, ok: true }, ...picks.map(p => ({ s: p.s, ok: false }))]) };
            }
        }

        /* ---------- โหมดต่อสมการ (แบบ Math24: รวมเลขทีละคู่) ---------- */
        function makeM(d) {
            if (d === 'expert') {
                for (; ;) {
                    const n = Array.from({ length: 4 }, () => 1 + rnd(9)), good = [], seen = new Set();
                    for (let t = 0; t < 6000 && good.length < 12; t++) {
                        const e = rndExpr(shuffle(n.slice()));
                        if (!e || !isFinite(e.v) || !/[²³√]/.test(e.s) || seen.has(e.s)) continue; seen.add(e.s);
                        if (Math.abs(e.v - 24) < 1e-6) good.push(e);
                    }
                    if (good.length) return { n: shuffle(n.slice()), sol: good[rnd(good.length)].s, pw: true };
                }
            }
            for (; ;) {
                const n = Array.from({ length: 4 }, () => 1 + rnd(DIFFS[d].max));
                let good = allExprs(n).filter(e => Math.abs(e.v - 24) < 1e-6);
                if (!good.length) continue;
                if (d === 'easy') { const a = good.filter(e => !/[÷−]/.test(e.s)), b = good.filter(e => !e.s.includes('÷')); good = a.length ? a : b.length ? b : good }
                return { n: shuffle(n.slice()), sol: good[rnd(good.length)].s, pw: false };
            }
        }
        /* เศษส่วนแบบแม่นยำ */
        const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
        const Fr = (n, d = 1) => { if (d < 0) { n = -n; d = -d } const g = gcd(n, d) || 1; return { n: n / g, d: d / g } };
        const fadd = (a, b) => Fr(a.n * b.d + b.n * a.d, a.d * b.d), fsub = (a, b) => Fr(a.n * b.d - b.n * a.d, a.d * b.d);
        const fmul = (a, b) => Fr(a.n * b.n, a.d * b.d), fdiv = (a, b) => Fr(a.n * b.d, a.d * b.n);
        const fstr = f => (f.n < 0 ? '−' : '') + Math.abs(f.n) + (f.d === 1 ? '' : '/' + f.d);
        const fval = f => f.n / f.d, is24 = f => f.d === 1 && f.n === 24;
        function funary(o, f) {
            if (o === '²') return fmul(f, f);
            if (o === '³') return fmul(fmul(f, f), f);
            if (f.n < 0) return null;
            const r = Math.round(Math.sqrt(f.n)), q = Math.round(Math.sqrt(f.d));
            return r * r === f.n && q * q === f.d ? Fr(r, q) : null;
        }
        const BIN = { '+': fadd, '−': fsub, '×': fmul, '÷': fdiv };
        let cid = 10;
        function mHint(t, err) { const h = $('mval'); h.textContent = t || '\u00a0'; h.className = 'mval' + (err ? ' err' : '') }
        function mDefaultHint() {
            if (!G || !G.cards) return;
            const a = G.cards.find(c => c.id === G.selA);
            mHint(!a ? 'แตะตัวเลขตัวแรก' : G.selOp ? `${fstr(a.f)} ${G.selOp}  แตะตัวเลขตัวที่สอง` : `${fstr(a.f)}  เลือกเครื่องหมาย${G.q.pw ? ' (หรือ ² ³ √)' : ''}`);
        }
        function mRender(popId, still) {
            $('nums').classList.add('b');
            $('nums').innerHTML = G.cards.map(c => {
                const t = fstr(c.f), z = t.length >= 5 ? 'sm' : t.length >= 3 ? 'md' : '';
                return `<button class="num ${c.col} ${z} ${still ? 'still' : ''} ${c.id === popId ? 'pop' : ''} ${c.id === G.selA ? 'sel' : ''}" data-id="${c.id}">${t}</button>`;
            }).join('');
            document.querySelectorAll('#mops .mop').forEach(b => b.classList.toggle('on', !!G.selOp && b.dataset.o === G.selOp));
        }
        function mReset(still) {
            G.cards = G.q.n.map((v, i) => ({ id: i, f: Fr(v), col: 'c' + i })); G.hist = []; G.selA = null; G.selOp = null;
            mRender(null, still); mDefaultHint();
        }
        const mLive = () => G && G.style === 'build' && G.phase === 'ask' && !G.paused && !G.busy;
        function mAfter(newId) {
            G.selA = null; G.selOp = null; mRender(newId, true);
            if (G.cards.length === 1) {
                const f = G.cards[0].f;
                if (is24(f)) { return mEnd(true) }
                if (!G.q.pw) {
                    const q = G.q, pen = G.mode === 'attack'; G.busy = true; shake(); beep(200, .18, .1, 'sawtooth');
                    if (pen) G.clock += 1000;
                    document.querySelector('#nums .num').classList.add('bad');
                    mHint(`ได้ ${fstr(f)} ยังไม่ใช่ 24` + (pen ? ' (เสียเวลา 1 วินาที)' : ' ลองใหม่'), true);
                    setTimeout(() => { if (G && G.q === q && G.phase === 'ask') { G.busy = false; mReset(true) } }, 850);
                    return;
                }
                mHint(`ได้ ${fstr(f)} — ใช้ ² ³ √ ต่อ หรือกดย้อนกลับ/ล้างเพื่อลองใหม่`, true); return;
            }
            mDefaultHint();
        }
        function mCard(id) {
            if (!mLive()) return;
            const c = G.cards.find(x => x.id === id); if (!c) return; beep(620, .04, .06);
            if (G.selA == null) G.selA = id;
            else if (G.selOp == null) G.selA = G.selA === id ? null : id;
            else if (G.selA === id) { G.selA = null; G.selOp = null }
            else {
                const a = G.cards.find(x => x.id === G.selA);
                if (G.selOp === '÷' && c.f.n === 0) { shake(); G.selOp = null; mRender(null, true); mHint('หารด้วย 0 ไม่ได้', true); return }

            (function frame(ts) {
                const dt = Math.min(ts - last, 60); last = ts;
                const h = hold[0];
                if (h && p >= h[0]) { h[1] -= dt; if (h[1] <= 0) hold.shift() } else p += dt * (99 / dur) * (.6 + Math.random() * .8);

                requestAnimationFrame(frame);
            })(last);
        })();
